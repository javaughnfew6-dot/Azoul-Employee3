<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Azoul Burnout Check-In</title>
    <style>
      /* Remove default margins so the blue fills the whole screen */
      html, body, #root { height: 100%; margin: 0; }
      body { background: #00CFFF; }
    </style>
    <!-- React + ReactDOM + Babel (Dev) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Your App: type="text/babel" lets the browser compile JSX -->
    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [stress, setStress] = useState("");
        const [support, setSupport] = useState("");
        const [motivation, setMotivation] = useState("");
        const [submitted, setSubmitted] = useState(false);
        const [burnoutScore, setBurnoutScore] = useState(null);

        function toNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }
        function calculateBurnout(stress, support, motivation) {
          const score = (toNum(stress) + (10 - toNum(support)) + (10 - toNum(motivation))) / 3;
          return Number(score.toFixed(1));
        }

        const handleSubmit = (e) => {
          e.preventDefault();
          const score = calculateBurnout(stress, support, motivation);
          setBurnoutScore(score);
          setSubmitted(true);
        };

        const handleReset = () => {
          setStress(""); setSupport(""); setMotivation("");
          setSubmitted(false); setBurnoutScore(null);
        };

        return (
          <div style={styles.page}>
            {/* Top logo in white */}
            <header style={styles.header}>
              <span style={styles.logoText}>Azoul</span>
            </header>

            {/* Bottom-docked card */}
            <div style={styles.bottomDock}>
              <section style={styles.card} aria-live="polite">
                {!submitted ? (
                  <form onSubmit={handleSubmit} noValidate>
                    <h1 style={styles.cardTitle}>Weekly Employee Burnout Check‑In</h1>

                    <div style={styles.inputGroup}>
                      <label htmlFor="stress" style={styles.label}>
                        How stressed are you this week? <strong>(1–10)</strong>
                      </label>
                      <input
                        id="stress" type="number" min="1" max="10" required
                        value={stress} onChange={(e)=>setStress(e.target.value)}
                        style={styles.input} inputMode="numeric"
                      />
                    </div>

                    <div style={styles.inputGroup}>
                      <label htmlFor="support" style={styles.label}>
                        Do you feel supported at work? <strong>(1–10)</strong>
                      </label>
                      <input
                        id="support" type="number" min="1" max="10" required
                        value={support} onChange={(e)=>setSupport(e.target.value)}
                        style={styles.input} inputMode="numeric"
                      />
                    </div>

                    <div style={styles.inputGroup}>
                      <label htmlFor="motivation" style={styles.label}>
                        How motivated are you this week? <strong>(1–10)</strong>
                      </label>
                      <input
                        id="motivation" type="number" min="1" max="10" required
                        value={motivation} onChange={(e)=>setMotivation(e.target.value)}
                        style={styles.input} inputMode="numeric"
                      />
                    </div>

                    <button type="submit" style={styles.buttonPrimary}>
                      Submit Check‑In
                    </button>
                  </form>
                ) : (
                  <div style={styles.resultBox}>
                    <h2 style={styles.resultTitle}>Your Burnout Risk Score</h2>
                    <div style={styles.score}>{burnoutScore}</div>
                    <Gauge value={burnoutScore} min={0} max={10} />
                    <p style={styles.riskText}>
                      {burnoutScore > 7 ? "⚠ High burnout risk"
                        : burnoutScore > 4 ? "Moderate burnout risk"
                        : "Low burnout risk"}
                    </p>
                    <div style={styles.actionsRow}>
                      <button onClick={handleReset} style={styles.buttonSecondary}>
                        Run Another Check
                      </button>
                    </div>
                  </div>
                )}
              </section>

              <footer style={styles.footer}>
                © {new Date().getFullYear()} Azoul — Protecting Teams. Preventing Burnout.
              </footer>
            </div>
          </div>
        );
      }

      /* ---------- Gauge ---------- */
      function Gauge({ value = 0, min = 0, max = 10 }) {
        const clamped = Math.max(min, Math.min(max, value));
        const pct = ((clamped - min) / (max - min)) * 100;
        const color = getRiskColor(pct);
        return (
          <div style={gaugeStyles.wrapper}>
            <div style={gaugeStyles.metaRow}>
              <span style={gaugeStyles.metaText}>Low</span>
              <span style={gaugeStyles.metaText}>High</span>
            </div>
            <div role="img" aria-label={`Burnout gauge at ${clamped} out of ${max}`} style={gaugeStyles.track}>
              <div style={{ ...gaugeStyles.fill, width: pct + "%", backgroundColor: color, boxShadow: `0 6px 16px ${color}55` }} />
            </div>
            <div style={gaugeStyles.ticksRow}>
              {[0,2,4,6,8,10].map(t => (
                <div key={t} style={gaugeStyles.tickWrap}>
                  <div style={gaugeStyles.tick} />
                  <span style={gaugeStyles.tickLabel}>{t}</span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function getRiskColor(pct){
        if (pct <= 50) return lerpColor("#2ecc71", "#f1c40f", pct/50);
        return lerpColor("#f1c40f", "#e74c3c", (pct-50)/50);
      }
      function lerpColor(h1,h2,t){
        const a = hexToRgb(h1), b = hexToRgb(h2);
        const r = Math.round(a.r + (b.r-a.r)*t);
        const g = Math.round(a.g + (b.g-a.g)*t);
        const b2 = Math.round(a.b + (b.b-a.b)*t);
        return `rgb(${r}, ${g}, ${b2})`;
      }
      function hexToRgb(hex){
        const h = hex.replace("#","");
        const n = h.length===3 ? h.split("").map(c=>c+c).join("") : h;
        const i = parseInt(n,16);
        return { r:(i>>16)&255, g:(i>>8)&255, b:i&255 };
      }

      /* ---------- Styles ---------- */
      const styles = {
        page: {
          fontFamily: "Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif",
          minHeight: "100vh",
          margin: 0,
          backgroundColor: "#00CFFF", /* solid ocean blue like your image */
          display: "flex",
          flexDirection: "column",
        },
        header: {
          position: "sticky",
          top: 0,
          width: "100%",
          textAlign: "center",
          padding: "28px 16px 8px",
          background: "transparent",
        },
        logoText: {
          color: "#fff",
          fontWeight: 900,
          fontSize: "46px",
          letterSpacing: "3px",
          textTransform: "uppercase",
          textShadow: "0 2px 10px rgba(0,0,0,0.15)",
        },
        bottomDock: {
          marginTop: "auto",
          padding: "12px 16px calc(env(safe-area-inset-bottom, 0) + 18px)",
        },
        card: {
          width: "100%",
          maxWidth: "560px",
          margin: "0 auto",
          background: "rgba(255,255,255,0.98)",
          borderRadius: "20px",
          padding: "24px",
          boxShadow: "0 18px 40px rgba(0,0,0,0.25)",
        },
        cardTitle: { margin: "0 0 8px", fontSize: "18px", color: "#0a2a3a", textAlign: "center", opacity: 0.9 },
        inputGroup: { marginBottom: "16px", display: "flex", flexDirection: "column" },
        label: { fontSize: "14px", fontWeight: 600, color: "#0a2a3a" },
        input: {
          marginTop: "8px", padding: "12px 14px", borderRadius: "12px",
          border: "1px solid #c9d7e0", outline: "none", fontSize: "16px"
        },
        buttonPrimary: {
          width: "100%", padding: "14px 16px", backgroundColor: "#0077B6",
          color: "white", border: "none", borderRadius: "12px", fontWeight: 700,
          fontSize: "16px", cursor: "pointer", marginTop: "8px",
          boxShadow: "0 10px 22px rgba(0, 119, 182, 0.35)",
        },
        buttonSecondary: {
          padding: "12px 16px", backgroundColor: "#e7f5ff", color: "#005b8c",
          border: "1px solid #b9e3ff", borderRadius: "12px", fontWeight: 600, cursor: "pointer",
        },
        resultBox: { textAlign" },
        score: { fontSize: "56px", color: "#0077B6", margin: "16px 0 8px", fontWeight: 800 },
        riskText: { margin: "8px 0 0", fontSize: "16px", color: "#0a2a3a" },
        actionsRow: { marginTop: "18px", display: "flex", justifyContent: "center" },
        footer: {
          width: "100%", maxWidth: "560px", margin: "10px auto 0",
          textAlign: "center", fontSize: "12px", color: "rgba(255,255,255,0.95)",
          textShadow: "0 1px 2px rgba(0,0,0,0.2)",
        },
      };

      const gaugeStyles = {
        wrapper: { margin: "8px 0 6px" },
        metaRow: { display: "flex", justifyContent: "space-between", marginBottom: "6px", padding: "0 2px" },
        metaText: { fontSize: "12px", color: "#4b6472" },
        track: {
          position: "relative", height: "16px", borderRadius: "999px",
          background: "linear-gradient(90deg, #e8f6ef 0%, #fffbe6 50%, #fdecea 100%)",
          overflow: "hidden", boxShadow: "inset 0 1px 2px rgba(0,0,0,0.08)",
        },
        fill: {
          position: "absolute", left: 0, top: 0, bottom: 0, width: "0%",
          borderRadius: "999px",
          transition: "width 400ms ease, background-color 250ms ease, box-shadow 250ms ease",
        },
        ticksRow: { display: "flex", justifyContent: "space-between", marginTop: "6px" },
        tickWrap: { display: "flex", flexDirection: "column", alignItems: "center", width: "1px" },
        tick: { width: "1px", height: "8px", backgroundColor: "#b8c7d1" },
        tickLabel: { marginTop: "4px", fontSize: "10px", color: "#6b8897" },
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
